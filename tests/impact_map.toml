# Domain → suite mapping for tier-1 PR CI (docs/testing.md).
# Convention: path globs → domain; domains expand to suites. `full = true`
# runs every suite. Unmapped in-scope paths fail strict selection.

[domains.ai]
suites = [
  "test_ai_planner.gd",
  "test_ai_rules.gd",
]

[domains.army]
suites = [
  "test_army_field_rules.gd",
  "test_army_orders.gd",
  "test_battle_rules.gd",
]

[domains.audio]
suites = [
  "test_audio_director.gd",
  "test_audio_mix.gd",
  "test_map_soundtrack.gd",
]

[domains.battle]
suites = [
  "test_battle_rules.gd",
]

[domains.campaign]
suites = [
  "test_call_to_arms.gd",
  "test_campaign_defeat.gd",
  "test_campaign_end.gd",
  "test_capital_choice.gd",
  "test_capital_loss.gd",
