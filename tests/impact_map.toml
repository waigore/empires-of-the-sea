# Domain → suite mapping for tier-1 PR CI (docs/testing.md).
# Convention: path globs → domain; domains expand to suites. `full = true`
# runs every suite. Unmapped in-scope paths fail strict selection.

[domains.ai]
suites = [
  "test_ai_planner_rules.gd",
  "test_ai_campaign_rules.gd",
  "test_ai_observer.gd",
  "test_ai_rules.gd",
  "test_ai_phase_rules.gd",
  "test_land_battle_rules.gd"
]

[domains.army]
suites = [
  "test_land_battle_rules.gd",
  "test_army_orders.gd",
  "test_battle_rules.gd"
]

# Deterministic christening core and its three rosters (hulls, regiments,
# generals). They share one pick and one digest, so a naming change runs its own
# suites instead of pulling the fleet and army domains past the tier-1 budget.
[domains.naming]
suites = [
  "test_naming_rules.gd"
]

[domains.land_turn]
# Land battle pass + capital falls (split from MapPlayArmies). Tighter than full
# campaign so the army refactor stays inside the tier-1 5 min budget.
suites = [
  "test_land_battle_rules.gd",
  "test_army_orders.gd",
  "test_battle_rules.gd",
  "test_campaign_defeat.gd",
  "test_capital_loss.gd"
]

[domains.audio]
suites = [
  "test_audio_rules.gd"
]

[domains.battle]
suites = [
  "test_battle_rules.gd",
  "test_naming_rules.gd",
  "test_land_battle_rules.gd"
]

[domains.campaign]
suites = [
  "test_diplomacy_rules.gd",
  "test_campaign_defeat.gd",
  "test_campaign_end.gd",
  "test_civilian_turn_rules.gd",
  "test_capital_loss.gd",
  "test_capital_seat_screen.gd",
  "test_victory_screen.gd"
]

[domains.civilian]
suites = [
  "test_civilian_field_rules.gd",
  "test_court_ui_parts.gd",
  "test_civilian_turn_rules.gd",
  "test_yarn_plates_rules.gd",
  "test_map_screen_crown_orders.gd",
  "test_land_battle_rules.gd"
]

[domains.diplomacy]
suites = [
  "test_diplomacy_rules.gd",
  "test_diplomacy_lens.gd",
  "test_panel_parts_rules.gd",
  "test_diplomacy_screen.gd",
  "test_spycraft_rules.gd"
]

# The court's authored voice (wiki: dialogue-content-and-yarn): the catalogue,
# the Yarn runtime that reads its scripts and the locale keys a translation
# follows. Kept off the diplomacy domain so a line, a parser or a key change
# never pays for the lens, the screen and the spycraft suites.
[domains.dialogue]
suites = [
  "test_yarn_plates_rules.gd",
  "test_diplomacy_rules.gd",
  "test_panel_parts_rules.gd"
]

[domains.intel]
# Court dossier depth (wiki: ai-dossier; DR-20261110-25): the rules that read a
# court's acts and the spy despatch that feeds them. Kept apart from the broad
# diplomacy/espionage domains so a dossier change stays inside tier 1's budget.
suites = [
  "test_spycraft_rules.gd",
  "test_yarn_plates_rules.gd",
  "test_court_ui_parts.gd",
  "test_panel_parts_rules.gd"
]

# Economy rules / market math. Screen mounts stay on economy_ui so a
# consumption or turn-hook change does not pay for EconomyPanel (~2 min).
[domains.economy]
suites = [
  "test_market_economy_rules.gd",
  "test_diplomacy_rules.gd"
]

# Ledger / market sheet presentation. Rules paths stay on economy.
[domains.economy_ui]
suites = [
  "test_market_economy_rules.gd",
  "test_economy_screen.gd",
  "test_court_ui_parts.gd",
  "test_yarn_plates_rules.gd"
]

[domains.espionage]
suites = [
  "test_yarn_plates_rules.gd",
  "test_court_ui_parts.gd",
  "test_spycraft_rules.gd",
  "test_map_data_rules.gd",
  "test_research_rules.gd",
  "test_civilian_field_rules.gd",
  "test_map_screen.gd"
]

[domains.fleet]
suites = [
  "test_naval_rules.gd",
  "test_fleet_orders.gd",
  "test_market_economy_rules.gd",
  "test_battle_rules.gd"
]

# Capital yard helper extracted from the dossier. One suite: the dossier orders
# already speak every yard refusal. The full fleet domain stacked on
# naval_feeding overruns the tier-1 5 min job.
[domains.fleet_yard]
suites = [
  "test_fleet_orders.gd"
]

# Dossier odds without the MapScreen and codec round-trips (~2 min each).
# Those two plus the yard orders suite overrun the tier-1 5 min job. The
# orders suite mounts the dossier; zone odds stay on the naval rules suites.
[domains.fleet_dossier]
suites = [
  "test_battle_rules.gd",
  "test_land_battle_rules.gd",
  "test_market_economy_rules.gd",
  "test_naval_rules.gd",
  "test_fleet_orders.gd"
]

# Naval battle pass: the resolver, difficulty sea strength, ration morale and
# dossier odds. MapScreen and save-codec round-trips (~2 min each) stay off
# this domain so a naval-turn PR stays inside the tier-1 5 min budget.
[domains.naval_feeding]
suites = [
  "test_battle_rules.gd",
  "test_land_battle_rules.gd",
  "test_market_economy_rules.gd",
  "test_map_screen.gd",
  "test_naval_rules.gd"
]


# Fog of war (wiki: fog-and-exploration): the rules, the layer, the save and the
# AI gates that read a chart. Kept its own (small) domain so a fog change is
# tier-1 sized instead of pulling every map suite.
[domains.fog]
suites = [
  "test_map_data_rules.gd",
  "test_map_view_rules.gd",
  "test_save_codec.gd",
  "test_ai_rules.gd",
  "test_ai_campaign_rules.gd"
]

[domains.fort]
suites = [
  "test_land_battle_rules.gd"
]

# Hospitals: the province building, its rest tempo and its battle triage
# (DR-20261111-12). The suites that read the same numbers travel together.
[domains.hospital]
suites = [
  "test_land_battle_rules.gd",
  "test_ai_planner_rules.gd",
  "test_battle_rules.gd",
  "test_civilian_field_rules.gd",
  "test_map_data_rules.gd"
]

# The fleet AI's sight: the rival hunts and blockades only where its own chart
# reaches (DR-20261110-21 kept the naval pass for its own PR). The fleet
# domain's twelve suites say nothing about fog and would run past tier 1, so
# this slice names the suites that do.
[domains.naval_fog]
suites = [
  "test_ai_campaign_rules.gd",
  "test_ai_rules.gd",
  "test_naval_rules.gd",
  "test_fleet_orders.gd",
  "test_map_data_rules.gd"
]

# A court reads another court's order of battle only across its own chart
# (wiki: military-armies § Docket, fog-and-exploration § Explorer vs Spy;
# DR-20261112-09). The reading, the turn's handoff of it to the diplomacy phase
# and the phase itself are one concern, so this slice names the AI turn suite and
# the diplomacy rules suite instead of pulling the ai + fog + diplomacy domains
# (twelve suites) past the tier-1 5 min budget.
[domains.oob]
suites = [
  "test_naming_rules.gd",
  "test_ai_rules.gd",
  "test_diplomacy_rules.gd"
]

# The crown's muster roll (DR-20261113-12): the force projection, its ledger
# row and panel, the map jump behind Visit and the chrome that opens it. Kept
# its own small domain — the boards it touches (bar, back chain, HUD bind) are
# all driven by the roster/chrome suites named here — so a ledger change never
# pulls the map, menu or ui catch-alls past the tier-1 5 min budget.
[domains.muster]
suites = [
  "test_force_ledger_rules.gd",
  "test_map_screen_crown_orders.gd",
  "test_mobile_layout.gd"
]

# A blockade severs the harvest, not only the cargo (wiki:
# capital-and-connectivity § Blockade): the reading, the connectivity gate it
# feeds, the two extraction paths, the ledger that prices it and the two readings
# that name it. Named first because the civilian, economy, crown_road, muster and
# ui rules below each own one of these files and would run twelve to fifteen
# suites for a change none of them describes.
[domains.blockade]
suites = [
  "test_civilian_turn_rules.gd",
  "test_market_economy_rules.gd"
]

[[rules]]
match = "scripts/rules/blockades.gd*"
domain = "blockade"

[[rules]]
match = "scripts/rules/land_connectivity.gd"
domain = "blockade"

[[rules]]
match = "scripts/rules/extraction.gd"
domain = "blockade"

[[rules]]
match = "scripts/rules/economy_overseas.gd*"
domain = "blockade"

[[rules]]
match = "scripts/economy/economy_controller.gd"
domain = "blockade"

[[rules]]
match = "scripts/map/map_play_economy_ai.gd"
domain = "blockade"

[[rules]]
match = "scripts/map/map_play_blockades.gd*"
domain = "blockade"

[[rules]]
match = "scripts/map/map_play_improvements.gd"
domain = "blockade"

[[rules]]
match = "scripts/map/map_play_setup.gd"
domain = "blockade"

[[rules]]
match = "scripts/ui/dossier_copy.gd"
domain = "blockade"

[[rules]]
match = "scripts/ui/ledger_text.gd"
domain = "blockade"

[[rules]]
match = "tests/test_civilian_turn_rules.gd*"
domain = "blockade"

[[rules]]
match = "tests/test_market_economy_rules.gd*"
domain = "blockade"

# The crown's Build/work recruit queue and the pass that drains it: rules and
# adapter travel with the ledger, and their proof rides the economy suite plus
# the crown-order drives that press the muster, train and launch rows. Declared
# before the broad `scripts/map/**` glob so a queue change never pulls the whole
# map set past the tier-1 budget.
[[rules]]
match = "scripts/rules/recruit_queue.gd*"
domain = "economy"

[[rules]]
match = "scripts/map/map_play_recruits.gd*"
domain = "economy"

[[rules]]
match = "scripts/map/map_play_training.gd*"
domain = "economy"

# The gazette lines a completed recruit prints are a sheet concern.
[[rules]]
match = "scripts/rules/gazette_muster.gd*"
domain = "gazette"

[[rules]]
match = "scripts/rules/gazette_copy_muster.gd*"
domain = "gazette"

[[rules]]
match = "scripts/rules/force_ledger.gd*"
domain = "muster"

[[rules]]
match = "scripts/ui/force_ledger_*.gd*"
domain = "muster"

[[rules]]
match = "scripts/map/map_play_force_ledger.gd*"
domain = "muster"

[[rules]]
match = "tests/test_force_ledger_*.gd*"
domain = "muster"

# The cartouche seal, the Android back chain and the HUD build/bind that mount
# the ledger: all three are read by the roster screen suite the muster domain
# already names, so they ride with it instead of the menu/map catch-alls.
[[rules]]
match = "scripts/ui/top_bar.gd"
domain = "muster"

[[rules]]
match = "scripts/ui/back_request.gd"
domain = "muster"

# The HUD mount table that builds the ledger (and the civilian roster beside
# it): the roster screen suite boots the whole HUD and opens both, so it rides
# here instead of the ui catch-all's battle/court suites.
[[rules]]
match = "scripts/ui/hud_dossiers.gd"
domain = "muster"

[[rules]]
match = "scripts/map/map_play_setup.gd"
domain = "muster"

# A reading's own rules module, the turn that publishes it and the two map
# hooks that carry it. First match wins, so these sit above the ai/fog/
# diplomacy globs below.
[[rules]]
match = "scripts/rules/oob_readings.gd*"
domain = "oob"

[[rules]]
match = "tests/test_naming_rules.gd*"
domain = "oob"

[[rules]]
match = "scripts/ai/ai_turn.gd*"
domain = "oob"

[[rules]]
match = "scripts/map/map_play_court_fog.gd*"
domain = "oob"

[[rules]]
match = "scripts/map/map_play_diplomacy.gd*"
domain = "oob"

# Rival diplomacy AI pass (readings + charts context); keep with OOB so a
# charted-land planner change runs the same suites as map_play_court_fog.
[[rules]]
match = "scripts/map/map_play_diplomacy_ai.gd*"
domain = "oob"

# Pending call / intervention / proposal prompts; stay on diplomacy with the
# court panel suites rather than pulling the OOB set.
[[rules]]
match = "scripts/map/map_play_diplomacy_consent.gd*"
domain = "diplomacy"

