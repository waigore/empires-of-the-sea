# Dossier sheet shells (HudPanelSlot / DossierHeader / row kit). Keep on ui so a
# shell extract does not pull army/fleet/intel domains past the tier-1 budget;
# map_play and rules paths still own those domains for behavior changes.
[[rules]]
match = "scripts/ui/army_panel.gd*"
domain = "ui"

# Roster and muster blocks are dossier presentation, not army rules: keep them
