# Home-fleet merge rules belong with the fleet suites, not the rules catch-all.
[[rules]]
match = "scripts/rules/fleet_home_merge.gd*"
domain = "fleet"

# A deed raises a Minor or Tribe town (DR-20261112-01). The growth rule rides
# with the civilian suites that own the Merchant and its purchase tests;
# `land_purchase.gd` keeps the existing `land_*.gd` economy mapping.
[[rules]]
match = "scripts/rules/minor_town_growth.gd*"
domain = "civilian"

# Its own suite rides with the fleet set too.
[[rules]]
match = "tests/test_home_merge.gd*"
domain = "fleet"

[[rules]]
match = "scripts/rules/**"
domain = "misc"

# Unit medallions: one plate per worker, hull and regiment type, plus the row
# widget. Kept off the menu catch-all so a plate change stays tier-1 sized.
