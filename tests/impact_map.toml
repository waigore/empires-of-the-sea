# Domain → suite mapping for tier-1 PR CI (docs/testing.md).
# Convention: path globs → domain; domains expand to suites. `full = true`
# runs every suite. Unmapped in-scope paths fail strict selection.

[domains.ai]
suites = [
  "test_ai_work_rules.gd",
  "test_ai_economy_rules.gd",
  "test_ai_colonisation.gd",
  "test_ai_diplomacy_offers.gd",
  "test_ai_invasion.gd",
  "test_ai_observer.gd",
  "test_ai_planner.gd",
  "test_ai_rules.gd",
  "test_military_parity.gd",
]

[domains.army]
suites = [
  "test_army_field_rules.gd",
  "test_army_orders.gd",
  "test_army_regiment_names.gd",
  "test_battle_rules.gd",
  "test_difficulty.gd",
  "test_general_names.gd",
  "test_hospital_rules.gd",
]

[domains.land_turn]
# Land battle pass + capital falls (split from MapPlayArmies). Tighter than full
# campaign so the army refactor stays inside the tier-1 5 min budget.
suites = [
  "test_army_field_rules.gd",
  "test_army_orders.gd",
  "test_battle_rules.gd",
  "test_difficulty.gd",
  "test_campaign_defeat.gd",
  "test_capital_loss.gd",
  "test_hospital_rules.gd",
]

