[domains.intel]
# Court dossier depth (wiki: ai-dossier; DR-20261110-25): the rules that read a
# court's acts and the spy despatch that feeds them. Kept apart from the broad
# diplomacy/espionage domains so a dossier change stays inside tier 1's budget.
suites = [
  "test_intel_dossier.gd",
  "test_intel_rules.gd",
  "test_espionage.gd",
  "test_diplomacy_panel.gd",
]

[domains.economy]
