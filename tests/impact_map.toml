# Domain → suite mapping for tier-1 PR CI (docs/testing.md).
# Convention: path globs → domain; domains expand to suites. `full = true`
# runs every suite. Unmapped in-scope paths fail strict selection.

[domains.ai]
suites = [
  "test_ai_rules.gd",
  "test_ai_observer.gd",
  "test_battle_rules.gd",
]

# Observer panel chrome only: the planner/campaign AI fan-out overruns tier-1
# when a sheet factory PR also touches other UI domains (docs/testing.md).
[domains.ai_panel]
suites = [
  "test_ai_observer.gd",
  "test_panel_parts_rules.gd",
]

[domains.army]
suites = [
  "test_battle_rules.gd",
  "test_army_orders.gd",
]

# March order + toast only: battle boots overrun tier 1 when map_play_armies
# stacks on diplomacy / province_sheet / impact_map (deed bar).
[domains.army_orders]
suites = [
  "test_army_orders.gd",
]

# Deterministic christening core and its three rosters (hulls, regiments,
# generals). They share one pick and one digest, so a naming change runs its own
# suites instead of pulling the fleet and army domains past the tier-1 budget.
[domains.naming]
suites = [
  "test_battle_rules.gd",
]

[domains.land_turn]
# Land battle pass + capital falls (split from MapPlayArmies). Tighter than full
# campaign so the army refactor stays inside the tier-1 5 min budget.
suites = [
  "test_battle_rules.gd",
  "test_army_orders.gd",
  "test_campaign_end.gd",
  "test_campaign_rules.gd",
]

[domains.audio]
suites = [
  "test_audio_rules.gd",
]

[domains.battle]
suites = [
  "test_battle_rules.gd",
]

[domains.campaign]
suites = [
  "test_diplomacy_rules.gd",
  "test_campaign_end.gd",
  "test_civilian_turn_rules.gd",
  "test_campaign_rules.gd",
]

# The chart's tap law: pure, so its own suite is the whole proof.
[domains.chart_tap]
suites = [
  "test_chart_tap.gd",
]

[domains.civilian]
suites = [
  "test_civilian_turn_rules.gd",
  "test_panel_parts_rules.gd",
  "test_a_map_screen.gd",
  "test_battle_rules.gd",
]

# The court's own pick: one reading over the planner's plan, proved by the AI
# suite (the pick), the civilian suite (the wording) and the sheet suite (the
# line). Kept apart from `civilian` so the pick never pays for the battle suite.
[domains.civilian_pick]
suites = [
  "test_ai_rules.gd",
  "test_civilian_turn_rules.gd",
  "test_panel_parts_rules.gd",
]

[domains.diplomacy]
suites = [
  "test_diplomacy_rules.gd",
  "test_a_map_screen.gd",
  "test_panel_parts_rules.gd",
  "test_diplomacy_screen.gd",
]

# The court's authored voice (wiki: dialogue-content-and-yarn): the catalogue,
# the Yarn runtime that reads its scripts and the locale keys a translation
# follows. Kept off the wide diplomacy domain so a line, a parser or a key
# change never pays for the lens and the screen.
[domains.dialogue]
suites = [
  "test_diplomacy_rules.gd",
  "test_panel_parts_rules.gd",
]

[domains.intel]
# Court dossier depth (wiki: ai-dossier; DR-20261110-25): the rules that read a
# court's acts and the spy despatch that feeds them. Kept apart from the broad
# diplomacy/espionage domains so a dossier change stays inside tier 1's budget.
suites = [
  "test_panel_parts_rules.gd",
  "test_diplomacy_rules.gd",
]

# Economy rules / market math. Screen mounts stay on economy_ui so a
# consumption or turn-hook change does not pay for EconomyPanel (~2 min).
[domains.economy]
suites = [
  "test_market_economy_rules.gd",
  "test_diplomacy_rules.gd",
]

# Ledger / market sheet presentation. Rules paths stay on economy.
[domains.economy_ui]
suites = [
  "test_market_economy_rules.gd",
  "test_economy_screen.gd",
  "test_panel_parts_rules.gd",
]

# The shared row skeleton every crown ledger prints (issue #669): the name, its
# chip and the Visit door. Each sheet's own suite mounts its rows, so they all
# follow rather than the ledger_* glob's economy_ui, which never builds one.
[domains.ledger_row]
suites = [
  "test_ledgers.gd",
  "test_a_map_screen.gd",
  "test_mobile_layout.gd",
]

# The shared widget kit every sheet's prose, captions and rows come from (issue
# #693): a size-flag change here collapses or widens text on all nine HUD sheets
# at once, so the suites that mount them follow — plus the two that build its
# widgets directly and the plate that prints its serif wrap.
[domains.row_builder]
suites = [
  "test_ledgers.gd",
  "test_a_map_screen.gd",
  "test_mobile_layout.gd",
  "test_panel_parts_rules.gd",
  "test_market_economy_rules.gd",
  "test_battle_rules.gd",
]

[domains.ledger_shell]
# The shared docked-ledger chrome: each ledger's own suite proves its body on
# the sheet that LedgerFrame draws, and panel_parts holds the chrome cases.
suites = [
  "test_economy_screen.gd",
  "test_research_rules.gd",
  "test_panel_parts_rules.gd",
  "test_diplomacy_rules.gd",
]

[domains.espionage]
suites = [
  "test_panel_parts_rules.gd",
  "test_map_view_rules.gd",
  "test_research_rules.gd",
  "test_civilian_turn_rules.gd",
  "test_a_map_screen.gd",
  "test_diplomacy_rules.gd",
]

[domains.fleet]
suites = [
  "test_naval_rules.gd",
  "test_fleet_orders.gd",
  "test_market_economy_rules.gd",
  "test_battle_rules.gd",
]

# Capital yard helper extracted from the dossier. One suite: the dossier orders
# already speak every yard refusal. The full fleet domain stacked on
# naval_feeding overruns the tier-1 5 min job.
[domains.fleet_yard]
suites = [
  "test_fleet_orders.gd",
]

# Dossier odds without the MapScreen and codec round-trips (~2 min each).
# Those two plus the yard orders suite overrun the tier-1 5 min job. The
# orders suite mounts the dossier; zone odds stay on the naval rules suites.
[domains.fleet_dossier]
suites = [
  "test_battle_rules.gd",
  "test_market_economy_rules.gd",
  "test_naval_rules.gd",
  "test_fleet_orders.gd",
]

# The fleet's passenger block: the landing data the block reads and the block
# itself (wiki: civilian-units § Overseas deployment). The orders suite mounts
# the dossier and presses the intents; the panel suite mounts the rows. Declared
# ahead of the civilian and fleet globs so a voyage edit never pays for the map
# screen or the battle suite.
[domains.naval_voyage]
suites = [
  "test_fleet_orders.gd",
  "test_panel_parts_rules.gd",
  "test_mobile_layout.gd",
]

# Naval battle pass: the resolver, difficulty sea strength, ration morale and
# dossier odds. MapScreen and save-codec round-trips (~2 min each) stay off
# this domain so a naval-turn PR stays inside the tier-1 5 min budget.
[domains.naval_feeding]
suites = [
  "test_battle_rules.gd",
  "test_market_economy_rules.gd",
  "test_a_map_screen.gd",
  "test_naval_rules.gd",
]


# Fog of war (wiki: fog-and-exploration): the rules, the layer, the save and the
# AI gates that read a chart. Kept its own (small) domain so a fog change is
# tier-1 sized instead of pulling every map suite.
[domains.fog]
suites = [
  "test_map_view_rules.gd",
  "test_campaign_end.gd",
  "test_ai_rules.gd",
]

[domains.fort]
suites = [
  "test_battle_rules.gd",
]

# Hospitals: the province building, its rest tempo and its battle triage
# (DR-20261111-12). The suites that read the same numbers travel together.
[domains.hospital]
suites = [
  "test_battle_rules.gd",
  "test_ai_rules.gd",
  "test_civilian_turn_rules.gd",
  "test_map_view_rules.gd",
]

# The fleet AI's sight: the rival hunts and blockades only where its own chart
# reaches (DR-20261110-21 kept the naval pass for its own PR). The fleet
# domain's twelve suites say nothing about fog and would run past tier 1, so
# this slice names the suites that do.
[domains.naval_fog]
suites = [
  "test_ai_rules.gd",
  "test_naval_rules.gd",
  "test_fleet_orders.gd",
  "test_map_view_rules.gd",
]

# A court reads another court's order of battle only across its own chart
# (wiki: military-armies § Docket, fog-and-exploration § Explorer vs Spy;
# DR-20261112-09). The reading, the turn's handoff of it to the diplomacy phase
# and the phase itself are one concern, so this slice names the AI turn suite and
# the diplomacy rules suite instead of pulling the ai + fog + diplomacy domains
# past the tier-1 5 min budget.
[domains.oob]
suites = [
  "test_ai_rules.gd",
  "test_diplomacy_rules.gd",
  "test_battle_rules.gd",
]

# The crown's sheets (DR-20261113-12, DR-20261115-09): the force projection,
# its ledger row and panel, the map jump behind Visit, the province ledger
# beside it and the chrome that opens both. Kept its own small domain — the
# boards they touch (bar, back chain, HUD bind, dossier door) are all driven by
# the suites named here — so a ledger change never pulls the map, menu or ui
# catch-alls past the tier-1 5 min budget.
[domains.muster]
suites = [
  "test_ledgers.gd",
  "test_a_map_screen.gd",
  "test_mobile_layout.gd",
]

# What a raise yard's one press costs before it is pressed (DR-20261118-11): one
# pure walk both yards read and both sheets print. Its own small slice proves the
# sum, the two yards that file it and the sheets that print it, instead of the
# rules' misc catch-all or the whole muster/fleet/army fan-out.
[domains.batch_sum]
suites = [
  "test_fleet_orders.gd",
  "test_army_orders.gd",
  "test_panel_parts_rules.gd",
]

# What a crown raise sheet's one press spends before it is pressed
# (DR-20261118-12): one pure walk the towns, the walls, the hospitals and the
# estates read. The ledger suite proves the walk and the sheets that print it
# (it mounts all four), so the muster and pause domains' wider sets never ride a
# pricing change.
[domains.raise_line]
suites = [
  "test_ledgers.gd",
  "test_panel_parts_rules.gd",
]

# The words one estate row prints (split out of [EstateRows] for REQ-P3-01): the
# civilian suite proves the figures behind the line and the panel-parts boot the
# ESTATES ledger that renders it, so a wording change never pays for the whole
# prospect fan-out (tier-1 5 min budget).
[domains.estate_row_words]
suites = [
  "test_civilian_turn_rules.gd",
  "test_panel_parts_rules.gd",
]

# The crown's eyes (DR-20261115-10): the intelligence projection and its sheet.
# One suite — it mounts the map screen, presses the court's EYES door and reads
# the network — so the espionage domain's seven suites (test_a_map_screen among
# them) never ride a reading change.
[domains.eyes]
suites = [
  "test_ledgers.gd",
]

# The reading the crown's people print (DR-20261121-12): the roster's one gold
# line, proved by the ledger suite that already mounts the HUD and opens the
# people sheet.
[domains.people_pick]
suites = [
  "test_ledgers.gd",
  "test_civilian_turn_rules.gd",
]

# The crown's navy (DR-20261115-14): the hull-by-hull projection and its sheet
# share the ledgers boot — the projection on a two-chart fixture and the sheet on
# the shared map screen — so a navy reading change never pulls the fleet domain's
# four suites or the ui catch-all's.
[domains.navy]
suites = [
  "test_ledgers.gd",
]

# The crown's army (DR-20261116-16): the regiment-by-regiment projection and its
# sheet share the ledgers boot — the projection on the muster fixture and the
# sheet on the shared map screen — so an army reading change never pulls the army
# rules' suites or the ui catch-all's.
[domains.army_read]
suites = [
  "test_ledgers.gd",
]

# The world's colonies (DR-20261117-02): the colony projection and its sheet
# share the ledgers boot — the projection on a two-chart fixture and the sheet on
# the shared map screen — so a colony reading change never pulls the diplomacy
# domain's four suites or the ui catch-all's.
[domains.colonies]
suites = [
  "test_ledgers.gd",
]

# The dress the crown's sheets all print in — the chart/reading strip and the
# grouped list — shared by the provinces, towns, muster, navy, people and
# command sheets. A change to it runs the suites that drive those sheets,
# instead of the whole map or ui fan-out.
[domains.ledger_dress]
suites = [
  "test_ledgers.gd",
  "test_a_map_screen.gd",
]

# A rival's naval strength is read only after the crown has watched her across
# a turn (wiki: ships-and-naval § Sighted strength; DR-20261113-20). The watch,
# the marker that prints `*`, the dossier that prints ???, the turn hook that
# opens the watch and the save that carries it travel as one slice: the orders
# suite mounts the chart and the dossier, the codec suite proves the save, and
# the new rules suite proves the clock. Declared before the fleet, chart_art,
# ui and save globs so the intel change never pulls their whole fan-out.
[domains.naval_intel]
suites = [
  "test_naval_rules.gd",
  "test_fleet_orders.gd",
  "test_campaign_end.gd",
]

# A blockade severs the harvest, not only the cargo (wiki:
# capital-and-connectivity § Blockade): the reading, the connectivity gate it
# feeds, the two extraction paths, the ledger that prices it and the two readings
# that name it. Named first because the civilian, economy, crown_road, muster and
# ui rules below each own one of these files and would run twelve to fifteen
# suites for a change none of them describes.
[domains.blockade]
suites = [
  "test_civilian_turn_rules.gd",
  "test_market_economy_rules.gd",
]

[[rules]]
match = "scripts/rules/blockades.gd*"
domain = "blockade"

[[rules]]
match = "scripts/rules/land_connectivity.gd"
domain = "blockade"

[[rules]]
match = "scripts/rules/land_town_rule.gd"
domain = "blockade"

[[rules]]
match = "scripts/rules/extraction.gd"
domain = "blockade"

[[rules]]
match = "scripts/rules/economy_overseas.gd*"
domain = "blockade"

[[rules]]
match = "scripts/economy/economy_controller.gd"
domain = "blockade"

# Shared war query (Hostility.at_war). Call-site edits that only switch the
# query — and the helper itself — stay on this slice so they do not union
# fleet + naval_feeding + naval_intel + ai past the tier-1 5 min budget.
[domains.hostility]
suites = [
  "test_naval_rules.gd",
  "test_fleet_orders.gd",
  "test_ai_rules.gd",
  "test_army_orders.gd",
]

[[rules]]
match = "scripts/rules/hostility.gd*"
domain = "hostility"

[[rules]]
match = "scripts/rules/naval_combat.gd*"
domain = "hostility"

# The turn's battles across every region (one pass, node-free): the fleet and
# naval suites prove it, so it rides with the same domain instead of the rules
# catch-all.
[[rules]]
match = "scripts/rules/naval_battles.gd*"
domain = "hostility"

[[rules]]
match = "scripts/rules/naval_strength.gd*"
domain = "hostility"

[[rules]]
match = "scripts/rules/naval_interception.gd*"
domain = "hostility"

[[rules]]
match = "scripts/rules/naval_raid.gd*"
domain = "hostility"

# Station holders for the catch and the prize (extracted from interception/
# raid). Same hostility slice as those callers — not the naval_* → fleet glob.
[[rules]]
match = "scripts/rules/naval_station.gd*"
domain = "hostility"

[[rules]]
match = "scripts/rules/naval_retreat.gd*"
domain = "hostility"

[[rules]]
match = "scripts/rules/naval_transport.gd*"
domain = "hostility"

[[rules]]
match = "scripts/rules/naval_deck.gd*"
domain = "hostility"

[[rules]]
match = "scripts/rules/fleet_missions.gd*"
domain = "hostility"

[[rules]]
match = "scripts/rules/army_command.gd*"
domain = "hostility"

[[rules]]
match = "scripts/ai/ai_invasion_planner.gd*"
domain = "hostility"

[[rules]]
match = "scripts/ai/ai_military_planner.gd*"
domain = "hostility"

[[rules]]
match = "scripts/ai/ai_naval_planner.gd*"
domain = "hostility"

# Rival economy pass: stay on ai with the other MapPlay*Ai files so a court-
# reader fan-out does not union blockade/economy boots past the tier-1 budget.
[[rules]]
match = "scripts/map/map_play_economy_ai.gd"
domain = "ai"

# One court's economy turn (and its research/trade book), split out of the pass
# above: market + AI + civilian turn prove the plan (manufacture around the
# chest rows, #878); the full AI fan-out (observer + battle) overruns the
# tier-1 5 min budget.
[[rules]]
match = "scripts/map/map_play_economy_court*.gd*"
domain = "ai_economy"

[[rules]]
match = "scripts/map/map_play_blockades.gd*"
domain = "blockade"

# MapPlay* helpers that redirect screen talk to `play.screen` (#1210). Named
# before each helper's theme domain so the bridge rewrite stays on
# play_screen's three suites instead of unioning theme boots past the tier-1
# 5 min budget. Restore the prior domain when a non-screen change reshapes
# the helper (same pattern as the Auto shared-hook note below).
[[rules]]
match = "scripts/map/map_play_campaign.gd"
domain = "play_screen"

[[rules]]
match = "scripts/map/map_play_civilian_roster.gd"
domain = "play_screen"

[[rules]]
match = "scripts/map/map_play_fleet_intel.gd"
domain = "play_screen"

[[rules]]
match = "scripts/map/map_play_input.gd"
domain = "play_screen"

[[rules]]
match = "scripts/map/map_play_turn_finish.gd"
domain = "play_screen"

[[rules]]
match = "scripts/map/map_play_improvements.gd"
domain = "blockade"

# Pause door (before blockade / naval_intel / muster hub steals): the session,
# screen and setup only hand the menu across; the ledgers only park the seal.
# First match keeps a door PR inside the tier-1 5 min budget.
[[rules]]
match = "scripts/ui/game_menu_door.gd*"
domain = "pause"

[[rules]]
match = "scripts/map_screen.gd"
domain = "pause"

# The screen's assistants (see domains.map_mount). Named before the broad
# `scripts/map/**` glob so a mount or wiring edit does not pull the full map set.
[[rules]]
match = "scripts/map/map_play_region.gd*"
domain = "map_mount"

[[rules]]
match = "scripts/map/map_play_wiring.gd*"
domain = "map_mount"

[[rules]]
match = "scripts/map/sea_backdrop.gd*"
domain = "sea_tone"

[[rules]]
match = "ui/shaders/sea.gdshader*"
domain = "sea_tone"

# Session bag + its screen bridge: the play_screen domain proves the airings
# without the pause/menu fan-out that overruns tier-1 on a bridge PR.
[[rules]]
match = "scripts/session/play_session.gd*"
domain = "play_screen"

# Shared sheet chrome: court_ui_parts owns fit/fade/rows. The sheet domain's
# ledger/door fan-out overruns tier-1 when a factory PR also touches other UI.
[[rules]]
match = "scripts/ui/sheet_frame.gd*"
domain = "ui"

# The one modal every cartouche door stands on and the door that hosts a panel
# carrying its own chrome (issue #692). They are the sheet chrome plus the bar's
# doors, so a shell change runs the suites that mount those sheets instead of the
# menu catch-all's eight.
[[rules]]
match = "scripts/ui/modal_shell.gd*"
domain = "sheet"

[[rules]]
match = "scripts/ui/modal_door.gd*"
domain = "sheet"

# The one drag every plate shares (issue #1081): the phone suite proves the
# pointer path on a live dossier and on a bare plate, so a drag fix stays
# inside the layout domain instead of the menu catch-all's six suites.
[[rules]]
match = "scripts/ui/modal_drag.gd*"
domain = "layout"

# The crown's news sheet is the Gazette's own surface (wiki: the-gazette): its
# one suite drives the sheet, so a plate change never pays for the menu set.
[[rules]]
match = "scripts/ui/gazette_plate.gd*"
domain = "gazette"

[[rules]]
match = "scripts/ui/civilian_roster_panel.gd*"
domain = "sheet"

[[rules]]
match = "scripts/ui/improvement_panel.gd*"
domain = "pause"

# The crown's one gold counsel line (CounselLine) is the estates card and the
# campaign sheets: its own cases ride the panel parts, the sheets that mount it
# ride the ledger suite.
[[rules]]
match = "scripts/ui/counsel_line.gd*"
domain = "sheet"

[[rules]]
match = "scripts/ui/force_ledger_*.gd*"
domain = "sheet"

[[rules]]
match = "scripts/ui/dossier_copy.gd"
domain = "blockade"

# The ledger's prose, one file per domain it speaks for (production, workers,
# market, the court's report). A wording change runs the sheets that print the
# lines, so the text files ride the economy_ui suites with their panels.
[[rules]]
match = "scripts/ui/ledger_*_text.gd*"
domain = "economy_ui"

[[rules]]
match = "tests/test_civilian_turn_rules.gd*"
domain = "blockade"

[[rules]]
match = "tests/test_market_economy_rules.gd*"
domain = "blockade"

# The crown's Build/work recruit queue and the pass that drains it: rules and
# adapter travel with the ledger, and their proof rides the economy suite plus
# the crown-order drives that press the muster, train and launch rows. Declared
# before the broad `scripts/map/**` glob so a queue change never pulls the whole
# map set past the tier-1 budget.
[[rules]]
match = "scripts/rules/recruit_queue.gd*"
domain = "economy"

# The crown's watch over rival squadrons (wiki: ships-and-naval § Sighted
# strength; DR-20261113-20): one slice, declared here so the first match beats
# the fleet, chart_art, ui and save globs below and the intel change never pulls
# their whole fan-out. The orders suite mounts the chart and the dossier, the
# codec suite proves the save, and the new rules suite proves the clock.
[[rules]]
match = "scripts/rules/naval_intel.gd*"
domain = "naval_intel"

[[rules]]
match = "scripts/rules/naval_strength.gd*"
domain = "naval_intel"

[[rules]]
match = "scripts/map/ship.gd*"
domain = "naval_intel"

[[rules]]
match = "scripts/map/map_play_fleets.gd*"
domain = "fleet_split"

# The crown's watch (fog, sighted strength, charted coast) reads in one module.
# Declared before the fleet and map globs so a watch-only edit re-runs the naval
# intel suites instead of their whole fan-out.
[[rules]]
match = "scripts/map/map_play_fleet_intel.gd*"
domain = "naval_intel"

# The dossier's station words (patrol, blockade, the catch it prices, the prize
# it takes) are read by the naval rules suite, so the file rides that slice
# instead of the eleven-suite `scripts/map/**` set (DR-20261120-02).
[[rules]]
match = "scripts/map/map_play_fleet_missions.gd*"
domain = "hostility"

# Station dossier prices extracted from fleet_missions; same slice so the
# notes file does not pull the six-suite `scripts/map/**` map domain.
[[rules]]
match = "scripts/map/map_play_station_notes.gd*"
domain = "hostility"

[[rules]]
match = "scripts/map/map_play_turn.gd*"
domain = "naval_intel"

[[rules]]
match = "scripts/map/map_play_turn_finish.gd*"
domain = "fleet"

[[rules]]
match = "scripts/ui/fleet_strength_section.gd*"
domain = "naval_intel"

[[rules]]
match = "scripts/session/play_session.gd*"
domain = "naval_intel"

[[rules]]
match = "scripts/save/save_codec.gd*"
domain = "naval_intel"

# A hull detaches into a squadron of her own (wiki: ships-and-naval § Ship
# instances; DR-20261116-12). The rules, the layer method that files the roster,
# the dossier intent that routes it and the drawer that offers the tap travel
# together; declared before the fleet, map and ui globs so the slice never pulls
# their whole fan-out. The naval rules suite carries the intel watch that also
# lives in `map_play_fleet_intel.gd`, so the two naval suites prove the whole
# slice.
[domains.fleet_split]
suites = [
  "test_naval_rules.gd",
  "test_fleet_orders.gd",
  "test_panel_parts_rules.gd",
]

[[rules]]
match = "scripts/rules/fleet_split.gd*"
domain = "fleet_split"

[[rules]]
match = "scripts/map/map_play_fleet_split.gd*"
domain = "fleet_split"

[[rules]]
match = "scripts/map/ship_layer.gd*"
domain = "fleet_split"

# Yard mutations and turn resolution the layer delegates to; they share the
# naval suites, so a yard or turn edit never pulls the whole `scripts/map/**`
# fan-out.
[[rules]]
match = "scripts/map/ship_yard_ops.gd*"
