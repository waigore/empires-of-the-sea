  "test_intel_rules.gd",
  "test_visibility.gd",
  "test_research_rules.gd",
  "test_civilian_field_rules.gd",
  "test_map_screen.gd",
]

[domains.fleet]
suites = [
  "test_fleet_rules.gd",
  "test_fleet_names.gd",
  "test_fleet_orders.gd",
  "test_fleet_rosters.gd",
  "test_naval_rules.gd",
  "test_economy_rules.gd",
  "test_battle_rules.gd",
]

# Naval battle pass: the resolver, the difficulty layer's sea strength, ration
# morale and the dossier odds, with the map hub that feeds them. Kept off the
# full fleet domain so a naval-battle PR stays inside the tier-1 5 min budget.
[domains.naval_feeding]
suites = [
  "test_battle_rules.gd",
  "test_difficulty.gd",
  "test_economy_rules.gd",
  "test_map_screen.gd",
  "test_naval_rules.gd",
  "test_save_codec.gd",
]


# Fog of war (wiki: fog-and-exploration): the rules, the layer, the save and the
# AI gates that read a chart. Kept its own (small) domain so a fog change is
# tier-1 sized instead of pulling every map suite.
[domains.fog]
suites = [
  "test_visibility.gd",
  "test_fog_layer.gd",
  "test_save_codec.gd",
  "test_ai_rules.gd",
  "test_ai_colonisation.gd",
  "test_ai_invasion.gd",
]

[domains.fort]
suites = [
  "test_fort_rules.gd",
  "test_hospital_rules.gd",
]

# Hospitals: the province building, its rest tempo and its battle triage
# (DR-20261111-12). The suites that read the same numbers travel together.
[domains.hospital]
suites = [
  "test_hospital_rules.gd",
  "test_ai_work_rules.gd",
  "test_battle_rules.gd",
  "test_civilian_field_rules.gd",
  "test_fort_rules.gd",
  "test_save_store.gd",
]

# The fleet AI's sight: the rival hunts and blockades only where its own chart
# reaches (DR-20261110-21 kept the naval pass for its own PR). The fleet
# domain's twelve suites say nothing about fog and would run past tier 1, so
# this slice names the suites that do.
[domains.naval_fog]
suites = [
  "test_ai_invasion.gd",
  "test_ai_rules.gd",
  "test_fleet_rules.gd",
  "test_fleet_orders.gd",
  "test_visibility.gd",
]

[domains.map]
