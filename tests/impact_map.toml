  "test_game_setup.gd",
  "test_ui_rules.gd",
  "test_main.gd",
  "test_menu_flow.gd",
  "test_mobile_layout.gd",
  "test_diplomacy_lens.gd",
  "test_resource_lens.gd",
]

[domains.misc]
suites = [
  "test_catalogs.gd",
  "test_difficulty.gd",
  "test_misc_rules.gd",
]

# Chart roster / province totals (wiki: naming § default ruleset, advanced-starts
# § locked full-init). Kept small so a six-minor / 60/30 change stays in tier 1.
[domains.world]
suites = [
  "test_catalogs.gd",
  "test_map_generator.gd",
  "test_world_bootstrap.gd",
  "test_world_setup.gd",
]

[domains.research]
