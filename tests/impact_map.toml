# Espionage suites live with their rules, so a spy change never needs the full
# run (scripts/rules/spy_*.gd and map_play_espionage.gd map here too). The spy
# despatch and its own suite feed the court dossier, so they travel with intel
# (DR-20261110-25).
[[rules]]
match = "tests/test_espionage.gd*"
domain = "intel"

[[rules]]
match = "tests/test_intel_rules.gd*"
domain = "intel"

[[rules]]
match = "tests/test_spy_*.gd*"
domain = "espionage"

[[rules]]
match = "tests/test_advanced_start.gd*"
domain = "advanced"

[[rules]]
match = "tests/test_advanced_start_live.gd*"
domain = "advanced"

[[rules]]
match = "tests/test_ui_rules.gd*"
domain = "menu"

[[rules]]
match = "tests/test_ui_*.gd"
domain = "ui"

[[rules]]
match = "tests/test_*.gd"
full = true

# Editor-generated companion files take a light mapping: a test script and its
# .uid always change together (Godot writes one per class_name script), and the
# misc suite set is the catch-all for helper-only changes.
[[rules]]
match = "tests/test_*.gd.uid"
domain = "misc"
