[domains.chart_art]
suites = [
  "test_yarn_plates_rules.gd",
  "test_map_canvas.gd",
  "test_map_screen.gd",
  "test_fleet_orders.gd"
]

# Commodity ink for the resource pictograms: the glyphs, the survey lens that
# rings them with status ink and the two HUD rows that draw the same marks.
# Presentational only, so the lens suite (which mounts the chart) and the panel
# parts suite (which mounts both rows) cover the patch instead of the broad
# map + ui fan-out blowing the tier-1 5 min budget.
[domains.resource_ink]
suites = [
  "test_resource_lens.gd",
  "test_panel_parts_rules.gd"
]

# Unit medallions: the painted art for every worker, hull and regiment type and
# the row widget that draws it. Presentational only, so the two dossiers that
# mount the rows plus the coverage suite keep a plate change inside tier 1.
[domains.unit_art]
suites = [
  "test_yarn_plates_rules.gd",
  "test_fleet_orders.gd",
  "test_army_orders.gd"
]

# Terrain wash shelf + shared theme: canvas + stamps cover the patch. chart_art
# also mounts map_screen / fleet_orders and those two alone can miss 5 min.
[domains.chart_bake]
suites = [
  "test_map_canvas.gd",
  "test_yarn_plates_rules.gd"
]

