# The despatch board: the toast plates, their hold queue behind a battle plate
# and the lane geometry. Its two suites are the only ones that raise, hold and
# release the court's news (REQ-P5-05, REQ-P5-06).
[domains.despatches]
suites = [
  "test_ui_rules.gd",
  "test_quick_battle_overlay.gd",
]

# Quick Battle: its UI plate, its resolver and the playtest instruments that
# drive it are exercised together.
[domains.quick_battle]
suites = [
  "test_quick_battle_overlay.gd",
  "test_battle_rules.gd",
  "test_hospital_rules.gd",
]

# The Gazette's rules (classification, prose, watchlist, archive) and the soft
# plate that prints them (wiki: the-gazette; DR-20261110-14).
[domains.gazette]
suites = [
  "test_gazette.gd",
  "test_gazette_plate.gd",
]

# The crown's charge at the opening of a campaign (wiki: dialogue-management
# § Kinds, `game_start_intro`): the rules that compose it, the page that prints
# it and the shell that raises it are one concern, so an intro change runs these
# suites instead of the broad menu set.
[domains.intro]
suites = [
  "test_campaign_intro.gd",
  "test_dialogue_rules.gd",
  "test_menu_flow.gd",
  "test_mobile_layout.gd",
]

# Rival first contact with a Tribe (wiki: diplomacy § GP–Tribe first contact):
# the pass, the chart read it makes, the turn that calls it and the suites that
# already drive a rival chart (visibility / AI sight) stay one domain.
[domains.tribe_contact]
suites = [
  "test_tribe_contact.gd",
  "test_diplomacy_screen.gd",
  "test_visibility.gd",
  "test_ai_rules.gd",
]

