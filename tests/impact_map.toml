  "test_map_canvas.gd",
  "test_map_symbols.gd",
  "test_map_generator.gd",
  "test_minimap.gd",
  "test_map_screen.gd",
  "test_map_screen_crown_orders.gd",
  "test_diplomacy_lens.gd",
  "test_diplomacy_survey.gd",
  "test_resource_lens.gd",
  "test_resource_survey.gd",
  "test_visibility.gd",
  "test_world_bootstrap.gd",
  "test_world_setup.gd",
]

# Crown-road lens: projection + view + the chrome that threads it. Kept its own
# (small) domain so a reading PR stays inside the tier-1 5 min budget instead of
# pulling map + menu + ui (mobile_layout) + economy + difficulty.
[domains.crown_road]
suites = [
  "test_crown_road_lens.gd",
  "test_crown_road_survey.gd",
]

# Prospect / mineral uncover (wiki: fog-and-exploration § Prospect; DR-20261111-26).
# Catalog + seeder + survey + Explorer policy travel together; kept off the full
# map + AI + economy fan-out so tier 1 stays inside 5 min.
[domains.prospect]
suites = [
  "test_ai_rules.gd",
  "test_catalogs.gd",
  "test_civilian_field_rules.gd",
  "test_map_generator.gd",
  "test_map_rules.gd",
  "test_map_screen_crown_orders.gd",
  "test_province_panel.gd",
  "test_resource_lens.gd",
  "test_resource_survey.gd",
  "test_world_setup.gd",
]

# Painted chart art: symbol stamps, the canvas that draws them and the fleet
# hull. Presentational only, so the four suites that mount the chart cover the
# patch; the broad map/fleet domains would blow the tier-1 5 min budget.
[domains.chart_art]
suites = [
  "test_map_symbols.gd",
  "test_map_canvas.gd",
  "test_map_screen.gd",
  "test_fleet_orders.gd",
]

# Unit medallions: the painted art for every worker, hull and regiment type and
# the row widget that draws it. Presentational only, so the two dossiers that
# mount the rows plus the coverage suite keep a plate change inside tier 1.
[domains.unit_art]
suites = [
  "test_ui_rules.gd",
  "test_fleet_orders.gd",
  "test_army_orders.gd",
]

# Terrain wash shelf + shared theme: canvas + stamps cover the patch. chart_art
# also mounts map_screen / fleet_orders and those two alone can miss 5 min.
[domains.chart_bake]
suites = [
  "test_map_canvas.gd",
  "test_map_symbols.gd",
]

# Shared chart behind MapScreen suites (docs/testing.md). Fixture edits gate
# the invariants the right-sized world is built for (slot floor, crown land,
# painted chart + campaign plate). Broader preloads stay on tier 2 — even a
# dozen heavy MapScreen suites miss the 5 min tier-1 budget.
[domains.map_fixture]
suites = [
  "test_advanced_start.gd",
  "test_map_screen.gd",
  "test_save_codec.gd",
  "test_victory_screen.gd",
]

[domains.advanced]
suites = [
  "test_advanced_start.gd",
  "test_advanced_start_live.gd",
]

# Setup difficulty layer (wiki: ruleset-config § Layers). Hub files that only
# carry the layer (map_screen, ai_state) map here so a difficulty PR stays
# inside the tier-1 5 min budget instead of pulling map+ai.
[domains.difficulty]
suites = [
  "test_ai_rules.gd",
  "test_army_orders.gd",
  "test_battle_rules.gd",
  "test_difficulty.gd",
  "test_game_setup.gd",
  "test_main.gd",
  "test_map_screen.gd",
  "test_menu_flow.gd",
  "test_misc_rules.gd",
  "test_save_codec.gd",
]

# The crown's own victory bar (wiki: victory § Military victory; DR-20261111-26):
# the level's published percentage reaches the win check, the charge that opens
# the campaign and the setup row that states it. One domain so a bar change
# stays inside the tier-1 5 min budget instead of pulling campaign + difficulty
# + intro + menu.
[domains.victory_bar]
suites = [
  "test_campaign_end.gd",
  "test_campaign_intro.gd",
  "test_difficulty.gd",
  "test_game_setup.gd",
  "test_menu_flow.gd",
  "test_misc_rules.gd",
