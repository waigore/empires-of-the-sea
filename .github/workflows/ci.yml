name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docs-lint:
    name: docs-lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Lint docs word limit (≤500)
        run: python tools/lint_docs_words.py

  arch-lint:
    name: arch-lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Lint modular architecture (P3 / RUB-P3-*)
        env:
          ARCH_LINT_RULES_DIFF: "1"
        run: python tools/lint_arch.py --require-rules-tests

  # Ban code ∩ skills in one PR so agents cannot rewrite their own workflows
  # while shipping game/test changes. Docs-only and skills-only PRs are fine.
  skills-isolation:
    name: skills-isolation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect code vs skills changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - 'scenes/**'
              - 'scripts/**'
              - 'ui/**'
              - 'autoload/**'
              - 'tests/**'
              - 'addons/**'
              - 'project.godot'
              - 'icon.svg'
              - 'gd-tools.toml'
              - 'tools/select_impacted_tests.py'
            skills:
              - '.agents/skills/**'
              - '.cursor/skills/**'
              - '.opencode/skill/**'
              - '.grok/skills/**'

      - name: Fail if code and skills both changed
        if: steps.filter.outputs.code == 'true' && steps.filter.outputs.skills == 'true'
        run: |
          echo "PR changes both test-triggering code paths and skill trees." >&2
          echo "Split into separate PRs: code-only or skills-only (docs+skills OK)." >&2
          exit 1

      - name: Skills isolation OK
        if: steps.filter.outputs.code != 'true' || steps.filter.outputs.skills != 'true'
        run: echo "code∩skills empty — OK."

  tests:
    name: tests
    runs-on: ubuntu-latest
    # Tier 1: impacted suites + patch coverage (docs/testing.md). ≤5 min.
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip on push to main (tier 2 owns full suite)
        id: skip_main_push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo 'Push to main — full suite is the 8-hourly tier-2 job.'

      - name: Detect code/test changes
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - 'scenes/**'
              - 'scripts/**'
              - 'ui/**'
              - 'autoload/**'
              - 'tests/**'
              - 'addons/**'
              - 'project.godot'
              - 'icon.svg'
              - 'gd-tools.toml'
              - 'tools/select_impacted_tests.py'

      - name: Skip suite (no code/test changes)
        if: >-
          github.event_name == 'pull_request' &&
          steps.filter.outputs.code != 'true'
        run: echo 'No code/test path changes — tests no-op (required check passes).'

      - name: Setup Python
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' && steps.filter.outputs.code == 'true')
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install gd-tools
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' && steps.filter.outputs.code == 'true')
        run: pip install "gd-tools-cli==0.10.0"

      - name: Setup Godot
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' && steps.filter.outputs.code == 'true')
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Verify tooling
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' && steps.filter.outputs.code == 'true')
        run: |
          godot --version
          gd-tools version

      - name: Import project
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' && steps.filter.outputs.code == 'true')
        run: godot --headless --path . --import --quit

      - name: Select impacted suites (strict map)
        id: impact
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' && steps.filter.outputs.code == 'true')
        env:
          GITHUB_BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          set -euo pipefail
          # Do not --prune: that can delete origin/main mid-job and empty the diff.
          git fetch --no-tags origin "${GITHUB_BASE_REF}"
          BASE="origin/${GITHUB_BASE_REF}"
          git rev-parse --verify "$BASE"
          python tools/select_impacted_tests.py --check-complete
          python tools/select_impacted_tests.py --base "$BASE" --github-output | tee /tmp/impact-suites.txt
          echo "Base: $BASE ($(git rev-parse --short "$BASE"))"
          echo "Changed vs base:"
          git diff --name-only --diff-filter=ACMR "${BASE}...HEAD" | head -50
          LIST=".gd-tools/impact-suites.txt"
          if [ ! -f "$LIST" ] || [ ! -s "$LIST" ]; then
            echo "Strict impact map: code paths changed but no suites selected." >&2
            exit 1
          fi

      - name: Run impacted tests (coverage collect, no overall min)
        id: run_tests
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' && steps.filter.outputs.code == 'true')
        run: |
          set -euo pipefail
          LIST=".gd-tools/impact-suites.txt"
          if [ ! -f "$LIST" ]; then
            echo "Missing $LIST from select step" >&2
            exit 1
          fi
          if grep -qx ALL "$LIST"; then
            echo "Impact map selected full suite"
            gd-tools test --coverage --parallel 4 --timeout 240 --junit-xml .gd-tools/results.xml
            exit 0
          fi
          mapfile -t SUITES < <(sed '/^$/d' "$LIST")
          if [ "${#SUITES[@]}" -eq 0 ]; then
            echo "Strict impact map: empty suite list after selection." >&2
            exit 1
          fi
          echo "Suites (${#SUITES[@]}):"
          printf '  %s\n' "${SUITES[@]}"
          gd-tools test --coverage --parallel 4 --timeout 240 --junit-xml .gd-tools/results.xml \
            "${SUITES[@]}"

      - name: Patch coverage gate (80% of changed executable lines)
        if: >-
          (github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' && steps.filter.outputs.code == 'true'))
          && steps.run_tests.outcome == 'success'
        env:
          GITHUB_BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          set -euo pipefail
          BASE="origin/${GITHUB_BASE_REF}"
          if [ ! -f .gd-tools/coverage/plan.json ]; then
            echo "Missing coverage plan after test run" >&2
            exit 1
          fi
          # Empty / comment-only patches pass (gd-tools: empty patch never fails).
          gd-tools coverage diff --patch --base "$BASE" \
            --patch-fail-under 80 --patch-annotations true
      - name: Upload test & coverage artifacts
        if: >-
          always() &&
          (github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' && steps.filter.outputs.code == 'true'))
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage
          path: |
            .gd-tools/results.xml
            .gd-tools/coverage/
          if-no-files-found: ignore

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect code/test changes
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - 'scenes/**'
              - 'scripts/**'
              - 'ui/**'
              - 'autoload/**'
              - 'tests/**'
              - 'addons/**'
              - 'project.godot'
              - 'icon.svg'
              - 'tools/e2e_smoke.gd'

      - name: Skip suite (no code/test changes)
        if: github.event_name != 'workflow_dispatch' && steps.filter.outputs.code != 'true'
        run: echo 'No code/test path changes — build no-op (required check passes).'

      - name: Setup Godot
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.code == 'true'
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Verify Godot
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.code == 'true'
        run: godot --version

      - name: Import / compile project
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.code == 'true'
        run: godot --headless --path . --import --quit

  e2e-smoke:
    name: e2e-smoke
    needs: build
    runs-on: ubuntu-latest
    # Hard budget: smoke wall time ≤2 minutes (see docs/testing.md).
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect code/test changes
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - 'scenes/**'
              - 'scripts/**'
              - 'ui/**'
              - 'autoload/**'
              - 'tests/**'
              - 'addons/**'
              - 'project.godot'
              - 'icon.svg'
              - 'tools/e2e_smoke.gd'

      - name: Skip suite (no code/test changes)
        if: github.event_name != 'workflow_dispatch' && steps.filter.outputs.code != 'true'
        run: echo 'No code/test path changes — e2e-smoke no-op (required check passes).'

      - name: Setup Godot
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.code == 'true'
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Verify Godot
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.code == 'true'
        run: godot --version

      - name: Import project
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.code == 'true'
        run: godot --headless --path . --import --quit

      - name: Run headless e2e smoke
        if: github.event_name == 'workflow_dispatch' || steps.filter.outputs.code == 'true'
        run: godot --headless --path . --script res://tools/e2e_smoke.gd
