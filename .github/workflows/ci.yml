name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install gd-tools
        run: pip install "gd-tools-cli==0.10.0"

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Verify tooling
        run: |
          godot --version
          gd-tools version

      - name: Import project
        run: godot --headless --path . --import --quit

      - name: Run tests with 80% coverage gate
        run: gd-tools test --coverage --min 80 --junit-xml .gd-tools/results.xml

      - name: Upload test & coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage
          path: |
            .gd-tools/results.xml
            .gd-tools/coverage/
          if-no-files-found: ignore

  android:
    name: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Create debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 9999 \
            -dname "CN=Android Debug,O=Android,C=US"

      # Godot requires the Java SDK path in editor settings; it does not fall back to
      # JAVA_HOME. The Android SDK path does fall back to ANDROID_HOME.
      - name: Configure Godot editor settings
        run: |
          set -euo pipefail
          CONFIG_DIR="${XDG_CONFIG_HOME:-$HOME/.config}/godot"
          mkdir -p "$CONFIG_DIR"
          cat > "$CONFIG_DIR/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/debug_keystore = "${HOME}/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import project
        run: godot --headless --path . --import --quit

      - name: Export debug APK
        run: |
          mkdir -p build/android
          godot --headless --path . --export-debug "Android Debug" build/android/empires-of-the-sea-debug.apk

      - name: Verify APK
        run: |
          set -euo pipefail
          APK=build/android/empires-of-the-sea-debug.apk
          test -s "$APK"
          "${ANDROID_HOME}/build-tools/36.0.0/aapt2" dump badging "$APK" | head -1
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | head -2
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libgodot_android.so"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: build/android/empires-of-the-sea-debug.apk
          if-no-files-found: error
