name: Automerge

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed, edited]
  # Re-enable auto-merge after required checks finish (incl. when approval-gate flips green).
  workflow_run:
    workflows: ["CI", "Approval gate"]
    types: [completed]

concurrency:
  group: automerge-${{ github.event.pull_request.number || github.event.workflow_run.head_branch || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  automerge:
    name: automerge
    runs-on: ubuntu-latest
    steps:
      - name: Resolve pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          PR=""
          if [ -n "${{ github.event.pull_request.number || '' }}" ]; then
            PR="${{ github.event.pull_request.number }}"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            PR="$(gh api \
              "repos/${{ github.repository }}/commits/${{ github.event.workflow_run.head_sha }}/pulls" \
              --jq 'map(select(.state=="open")) | .[0].number // empty')"
          fi

          if [ -z "${PR}" ]; then
            echo "No open PR for this event; skipping."
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          DRAFT="$(gh pr view "${PR}" --repo "${{ github.repository }}" --json isDraft --jq .isDraft)"
          if [ "${DRAFT}" = "true" ]; then
            echo "PR #${PR} is a draft; skipping."
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "number=${PR}" >> "${GITHUB_OUTPUT}"
          echo "skip=false" >> "${GITHUB_OUTPUT}"
          echo "Targeting PR #${PR}"

      - name: Enable squash auto-merge
        if: steps.pr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PR="${{ steps.pr.outputs.number }}"

          # GitHub waits until required checks (tests + approval-gate) are green.
          # Failures here usually mean checks are still pending/red; retry on later events.
          if gh pr merge "${PR}" --repo "${{ github.repository }}" --squash --auto --delete-branch; then
            echo "Squash auto-merge enabled for PR #${PR}."
          else
            echo "Could not enable auto-merge for PR #${PR} yet (checks/reviews may still be pending)."
          fi
