<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Empires of the Sea — project icon: a carrack under sail in a gold medallion.
       Master art. Android adaptive layers live in assets/art/branding/. -->
  <defs>
    <radialGradient id="sky" cx="50%" cy="34%" r="78%">
      <stop offset="0%" stop-color="#2a5f8b"/>
      <stop offset="52%" stop-color="#153c5e"/>
      <stop offset="100%" stop-color="#07121e"/>
    </radialGradient>
    <linearGradient id="canvas" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbf2dc"/>
      <stop offset="100%" stop-color="#e6d5ae"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7ecd2"/>
      <stop offset="100%" stop-color="#cdb98f"/>
    </linearGradient>
    <clipPath id="medallion">
      <circle cx="256" cy="256" r="219"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" fill="url(#sky)"/>

  <g clip-path="url(#medallion)">
    <!-- sea -->
    <path d="M0 362 C 60 352 120 372 180 364 C 240 356 300 374 360 366 C 420 358 470 370 512 362 L512 512 L0 512 Z" fill="#1c4d72"/>
    <path d="M0 396 C 70 386 130 406 200 398 C 270 390 330 408 400 400 C 450 394 490 402 512 398 L512 512 L0 512 Z" fill="#123a58"/>
    <path d="M0 362 C 60 352 120 372 180 364 C 240 356 300 374 360 366 C 420 358 470 370 512 362" fill="none" stroke="#7fb6d9" stroke-width="3" opacity="0.45"/>

    <!-- wake -->
    <ellipse cx="262" cy="370" rx="150" ry="9" fill="#061019" opacity="0.4"/>

    <!-- rigging stays -->
    <g stroke="#e8d9b6" stroke-width="2" opacity="0.28" fill="none">
      <path d="M252 84 L 340 118"/>
      <path d="M340 118 L 456 250"/>
      <path d="M160 124 L 252 84"/>
    </g>

    <!-- bowsprit -->
    <path d="M388 284 L 458 250 L 460 255 L 390 290 Z" fill="#e8d9b6"/>

    <!-- masts -->
    <g stroke="#e8d9b6" stroke-linecap="round">
      <path d="M160 262 L 160 124" stroke-width="7"/>
      <path d="M252 262 L 252 84" stroke-width="8"/>
      <path d="M340 246 L 340 118" stroke-width="7"/>
    </g>

    <!-- jib (forward plane, darker) -->
    <path d="M452 242 L 390 194 L 402 280 Z" fill="#dcc9a0"/>

    <!-- sails -->
    <g fill="url(#canvas)">
      <!-- mizzen lateen -->
      <path d="M104 232 L 206 128 L 156 232 Z"/>
      <!-- main course -->
      <path d="M196 222 C 190 240 194 252 206 260 Q 252 270 298 260 C 310 252 314 240 308 222 Z"/>
      <!-- main topsail -->
      <path d="M204 176 C 199 190 202 200 212 207 Q 252 215 292 207 C 302 200 305 190 300 176 Z"/>
      <!-- main topgallant -->
      <path d="M212 136 C 208 147 210 155 218 161 Q 252 168 286 161 C 294 155 296 147 292 136 Z"/>
      <!-- fore course -->
      <path d="M292 216 C 287 230 290 240 300 247 Q 340 255 380 247 C 390 240 393 230 388 216 Z"/>
      <!-- fore topsail -->
      <path d="M298 176 C 294 188 296 196 304 202 Q 340 209 376 202 C 384 196 386 188 382 176 Z"/>
      <!-- fore topgallant -->
      <path d="M304 142 C 301 152 303 159 310 164 Q 340 170 370 164 C 377 159 379 152 376 142 Z"/>
    </g>

    <!-- yards -->
    <g stroke="#e8d9b6" stroke-width="5" stroke-linecap="round">
      <path d="M192 222 L 312 222"/>
      <path d="M200 176 L 304 176"/>
      <path d="M208 136 L 296 136"/>
      <path d="M288 216 L 392 216"/>
      <path d="M294 176 L 386 176"/>
      <path d="M300 142 L 380 142"/>
      <path d="M104 232 L 206 128"/>
    </g>

    <!-- hull -->
    <path d="M92 232 L 160 232 L 160 252 L 292 258 L 292 242 L 352 242 L 388 258 L 396 292
             C 398 330 374 358 332 364 Q 270 370 208 366 C 160 364 112 340 104 300 L 100 258 Z" fill="url(#hull)"/>
    <!-- wale -->
    <path d="M92 232 L 160 232 L 160 252 L 292 258 L 292 242 L 352 242 L 388 258"
          fill="none" stroke="#cdb98f" stroke-width="7" stroke-linejoin="round"/>
    <!-- stern gallery -->
    <g fill="#123a58" opacity="0.7">
      <rect x="104" y="240" width="13" height="14" rx="2"/>
      <rect x="124" y="240" width="13" height="14" rx="2"/>
      <rect x="144" y="240" width="13" height="14" rx="2"/>
    </g>

    <!-- pennants -->
    <g fill="#b23a2f">
      <path d="M252 84 L 290 92 L 252 100 Z"/>
      <path d="M340 118 L 374 125 L 340 132 Z"/>
      <path d="M160 124 L 190 130 L 160 136 Z"/>
    </g>
  </g>

  <!-- period frame -->
  <circle cx="256" cy="256" r="219" fill="none" stroke="#c8a24a" stroke-width="5"/>
  <circle cx="256" cy="256" r="232" fill="none" stroke="#c8a24a" stroke-width="1.5" opacity="0.5"/>
</svg>
