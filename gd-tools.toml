[godot]

[test]
test_dirs = [
    "tests",
]
prefix = "test_"
suffix = ".gd"
runtime = "native"
# Per-test budget. CI runs with --parallel 4 and must finish ≤5 min overall
# (docs/testing.md). Shared map fixtures keep world gen off the hot path.
timeout_seconds = 30.0
# Suite workers by default. gd-tools boots one Godot process per suite, so a
# bare `gd-tools test` runs the full suite sequentially (~18 min) and blows the
# tier-1 budget; 4 keeps an unflagged run inside `docs/testing.md`'s 5 min.
parallel = 4
retries = 0
tags = []
random_order = false

[lint]
exclude = [
    "addons",
    ".godot",
    ".gd-tools",
    ".git",
    ".autolab",
]

[format]
exclude = [
    "addons",
    ".godot",
    ".gd-tools",
    ".git",
    ".autolab",
]
max_line_length = 100

[coverage]
enabled = true
min_percent = 80
format = "lcov"
output_dir = ".gd-tools/coverage"
exclude = [
    "addons",
    ".godot",
    ".gd-tools",
    ".git",
    ".autolab",
    "tests",
    "playtests",
    # The e2e smoke drives run in the e2e-smoke job, not the unit suites, so
    # their lines never appear in unit coverage. Counting them in the patch
    # gate would fail every smoke rewrite regardless of the tests that cover
    # the behaviour it drives (docs/testing.md § E2E).
    "tools/smoke",
    # A headless audit a person runs for a chart's readings (issue #1520); its
    # numbers live in the wiki evidence page, not in the suite.
    "tools/nw_seed_audit.gd",
]
test_dirs = [
    "tests",
    "playtests",
]
