[godot]

[test]
test_dirs = [
    "tests",
]
prefix = "test_"
suffix = ".gd"
runtime = "native"
# Per-test budget. CI runs with --parallel 4 and must finish ≤5 min overall
# (docs/testing.md). Shared map fixtures keep world gen off the hot path.
timeout_seconds = 30.0
retries = 0
tags = []
random_order = false

[lint]
exclude = [
    "addons",
    ".godot",
    ".gd-tools",
    ".git",
]

[format]
exclude = [
    "addons",
    ".godot",
    ".gd-tools",
    ".git",
]
max_line_length = 100

[coverage]
enabled = true
min_percent = 80
format = "lcov"
output_dir = ".gd-tools/coverage"
exclude = [
    "addons",
    ".godot",
    ".gd-tools",
    ".git",
    "tests",
    "playtests",
]
test_dirs = [
    "tests",
    "playtests",
]
