spec_version: 2
name: ai-bench
version: 0.1.0

metrics:
  - {name: score, direction: max}
  - {name: provinces, direction: max}
  - {name: forces, direction: max}
  # Share of the live crown's top-ranked objectives the ledger funded (issue
  # #491 T6). Ranking priorities is worthless if the allocator never pays for
  # them; the CI gate holds this above reports/ai-bench/guards.json.
  - {name: funded_pct, direction: max}

# Full 200-turn Godot runs can take several minutes; leave headroom.
watchdog_timeout_s: 1800

params:
  turns: {type: int, default: 200, min: 1, max: 2000}
  seed: {type: int, default: 1500}
  size: {type: int, default: 1, min: 0, max: 2}
